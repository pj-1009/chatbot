# The chatbot web app. Conversations live in Postgres, not in the pods, so it
# scales out freely and any replica can answer any request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  labels: { app.kubernetes.io/name: chatbot }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: chatbot }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chatbot }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: chatbot
          image: chatbot:local       # built and loaded into kind by `make k8s-up`
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: OLLAMA_HOST_URL, value: "http://ollama:11434" }
            - name: OLLAMA_MODEL
              valueFrom: { configMapKeyRef: { name: ollama, key: OLLAMA_MODEL } }
            - { name: SYSTEM_PROMPT, value: "You are a helpful, concise assistant." }
            - { name: MAX_HISTORY, value: "50" }
            - { name: PGHOST, value: postgres }
          envFrom:
            # PGUSER, PGPASSWORD and PGDATABASE
            - secretRef: { name: chatbot-db }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          # Not ready while the database is unreachable; still alive, so not restarted.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# NodePort 30090 is mapped to http://localhost:8090 by k8s/kind-cluster.yaml.
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  labels: { app.kubernetes.io/name: chatbot }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: chatbot }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30090 }
