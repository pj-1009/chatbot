# Postgres for the local cluster: stores the chat messages, and the knowledge
# base (document chunks with embeddings) for RAG. Every chatbot
# replica reads and writes it. In production, use a managed database (RDS,
# Cloud SQL, ...) and point the chatbot's PG* settings at it instead.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  clusterIP: None # headless: the DNS name "postgres" resolves to the pod
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17   # Postgres 17 with the pgvector extension, for RAG
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: chatbot-db, key: PGUSER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: chatbot-db, key: PGPASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: chatbot-db, key: PGDATABASE } }
            # A subdirectory, because the volume's root holds lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
