<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dc; --user: #2f5d50; --user-text: #ffffff; --bot: #efefea;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececE8; --muted: #9a9a93;
      --border: #33332f; --user: #3d7a69; --user-text: #ffffff; --bot: #2a2a27;
      --error: #f2867e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 760px; padding: 16px; display: flex;
    align-items: center; justify-content: space-between;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #log {
    flex: 1; width: 100%; max-width: 760px; overflow-y: auto;
    padding: 0 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .assistant { align-self: flex-start; background: var(--bot); }
  .error { align-self: flex-start; color: var(--error); font-size: 14px; }
  .sources { align-self: flex-start; color: var(--muted); font-size: 13px; margin-top: -4px; padding-left: 4px; }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
  form {
    width: 100%; max-width: 760px; padding: 16px; display: flex; gap: 8px;
  }
  textarea {
    flex: 1; font: inherit; resize: none; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    min-height: 46px; max-height: 200px;
  }
  form button { background: var(--user); color: var(--user-text); border: none; }
</style>
</head>
<body>
<header>
  <h1>Chatbot</h1>
  <button id="reset" type="button">New chat</button>
</header>
<main id="log"><p class="empty">Ask me anything.</p></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
  // The conversation is stored on the server (in Postgres), so any replica
  // can answer. The browser only remembers which conversation is its own.
  const STORAGE_KEY = "chatbot.conversationId";
  let conversationId = null;
  let controller = null;

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function newId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    // Fallback for pages not served from localhost or https.
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  function useConversation(id) {
    conversationId = id;
    try { localStorage.setItem(STORAGE_KEY, id); } catch {}
  }

  function clearLog() {
    log.innerHTML = '<p class="empty">Ask me anything.</p>';
  }

  function bubble(cls, text) {
    log.querySelector(".empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;          // textContent, never innerHTML: model output is untrusted
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function errorText(res) {
    const body = await res.json().catch(() => ({}));
    return body.error || "HTTP " + res.status;
  }

  // On page load: continue this browser's conversation, if it has one.
  async function loadHistory() {
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch {}
    useConversation(saved || newId());
    if (!saved) return;
    try {
      const res = await fetch("/api/history?conversation_id=" + encodeURIComponent(conversationId));
      if (!res.ok) throw new Error(await errorText(res));
      const { messages } = await res.json();
      for (const m of messages) bubble(m.role, m.content);
    } catch (e) {
      bubble("error", "Couldn't load the conversation: " + e.message);
    }
  }

  async function ask(text) {
    const myConversation = conversationId;
    bubble("user", text);
    const out = bubble("assistant", "…");
    let reply = "", failed = null, sources = [];
    send.disabled = true;
    controller = new AbortController();
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: myConversation, message: text }),
        signal: controller.signal,
      });
      if (!res.ok) throw new Error(await errorText(res));
      // Read the newline-delimited JSON stream as it arrives.
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          const msg = JSON.parse(line);
          if (msg.error) failed = msg.error;
          if (msg.sources) sources = msg.sources;
          if (msg.content) {
            reply += msg.content;
            out.textContent = reply;
            log.scrollTop = log.scrollHeight;
          }
        }
      }
    } catch (e) {
      if (e.name !== "AbortError") failed = e.message;
    } finally {
      controller = null;
      send.disabled = false;
      input.focus();
    }
    if (myConversation !== conversationId) return;  // the user started a new chat meanwhile
    if (!reply) out.remove();
    if (reply && sources.length) {
      // One entry per document, in order of relevance.
      const files = [...new Set(sources.map((s) => s.source))];
      bubble("sources", "Sources: " + files.join(", "));
    }
    if (failed) bubble("error", "Error: " + failed + " (this message wasn't saved)");
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    ask(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  // "New chat": delete the old conversation on the server and start a fresh one.
  document.getElementById("reset").addEventListener("click", async () => {
    const old = conversationId;
    useConversation(newId());
    controller?.abort();
    clearLog();
    input.focus();
    try {
      const res = await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: old }),
      });
      if (!res.ok) throw new Error(await errorText(res));
    } catch (e) {
      bubble("error", "Couldn't delete the old conversation: " + e.message);
    }
  });

  loadHistory();
</script>
</body>
</html>
